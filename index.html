<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel-Postcard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="postcard">
            <svg class="scene" viewBox="0 0 400 220" role="img" aria-label="Mountains under a rising sun">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#1b3b6f"/>
<stop offset="1" stop-color="#7ec8e3"/>
</linearGradient>
</defs>
<rect width="400" height="220" fill="url(#sky)"/>
<circle cx="300" cy="70" r="28" fill="#fff3b0"/>
<polygon points="40,220 160,60 280,220" fill="#2f5d8a"/>
<polygon points="160,220 280,100 400,220" fill="#17324f"/>
</svg>
<div class="motto">
    <h1>Greetings From the peak</h1>
    <p><q>Come and experience the chill for yourself</q></p>
</div>

        </section>
    </main>
</body>
</html>
